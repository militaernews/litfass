[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litfass"
version = "0.2.0"
description = "House adverts for Telegram bots: the litfass feed rendered as bot messages, with frequency caps. No ad network, no tracking."
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
telegram = ["python-telegram-bot>=21"]

[tool.setuptools]
packages = ["litfass"]
